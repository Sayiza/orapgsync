# Web Gateway Configuration
# Generated by orapgsync - Mod-PL/SQL Web Gateway

quarkus:
  datasource:
    db-kind: postgresql
    username: ${ENV_CO_DB_USERNAME}
    password: ${ENV_CO_DB_PASSWORD_ENCRYPTED}
    jdbc:
      url: ${ENV_CO_DB_JDBC_URL}
      telemetry: true
  hibernate-orm:
    dialect: org.hibernate.dialect.PostgreSQLDialect
    second-level-caching-enabled: false
    fetch:
      max-depth: 0
    jdbc:
      statement-fetch-size: 1000
    log:
      queries-slower-than-ms: 500
      bind-parameters: true
      sql: true
      format-sql: true
      jdbc-warnings: true
    validate-in-dev-mode: false
    database:
      globally-quoted-identifiers: false
  hibernate-orm."<default>":
    jdbc:
      lob:
        non-contextual-creation: true
  http:
    port: {{serverPort}}
  log:
    min-level: TRACE
    level: ${ENV_QUARKUS_LOG_LEVEL:INFO}
    category:
      "{{packageName}}":
        level: ${ENV_QUARKUS_LOG_CATEGORY_GATEWAY_LEVEL:INFO}
      "io.quarkus.http.access-log":
        level: ${ENV_QUARKUS_LOG_CATEGORY_HTTP_ACCESS_LOG_LEVEL:WARN}
      "org.apache.http.headers":
        level: ${ENV_QUARKUS_LOG_CATEGORY_HTTP_HEADERS_LEVEL:WARN}
      "org.apache.http.wire":
        level: ${ENV_QUARKUS_LOG_CATEGORY_HTTP_WIRE_LEVEL:WARN}

# Gateway-specific configuration
gateway:
  dad-name: {{dadName}}
  url-prefix: {{urlPrefix}}
  default-schema: {{defaultSchema}}
